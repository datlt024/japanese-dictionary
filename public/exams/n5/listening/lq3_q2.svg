<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2222"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#eef4ee"/>

  <!-- Outdoor background -->
  <rect x="0" y="280" width="560" height="100" fill="#c8d8a8"/>
  <!-- Path/walkway -->
  <rect x="180" y="280" width="80" height="100" fill="#e8e4d8"/>

  <!-- House exterior -->
  <!-- Wall -->
  <rect x="220" y="80" width="280" height="220" fill="#f5f0e8" stroke="#998" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="200,80 520,80 480,30 240,30" fill="#cc6633" stroke="#994422" stroke-width="2"/>
  <!-- Door frame + door (partially open) -->
  <rect x="300" y="180" width="80" height="120" fill="#886644" stroke="#664422" stroke-width="2"/>
  <!-- Door opened to the side -->
  <rect x="295" y="180" width="80" height="120" rx="2" fill="#aa8855" stroke="#664422" stroke-width="2.5"/>
  <!-- Door handle -->
  <circle cx="350" cy="240" r="6" fill="#ccaa44"/>
  <!-- Window -->
  <rect x="420" y="120" width="60" height="50" fill="#aaccee" stroke="#668" stroke-width="1.5"/>
  <line x1="450" y1="120" x2="450" y2="170" stroke="#668" stroke-width="1.5"/>
  <line x1="420" y1="145" x2="480" y2="145" stroke="#668" stroke-width="1.5"/>

  <!-- Person inside (host, at door) -->
  <circle cx="340" cy="164" r="18" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <rect x="326" y="182" width="28" height="45" rx="4" fill="#cc6644" stroke="#aa4422" stroke-width="1.5"/>
  <line x1="326" y1="190" x2="308" y2="210" stroke="#cc6644" stroke-width="6" stroke-linecap="round"/>
  <line x1="354" y1="190" x2="370" y2="205" stroke="#cc6644" stroke-width="6" stroke-linecap="round"/>
  <line x1="332" y1="227" x2="328" y2="265" stroke="#884422" stroke-width="6" stroke-linecap="round"/>
  <line x1="344" y1="227" x2="348" y2="265" stroke="#884422" stroke-width="6" stroke-linecap="round"/>

  <!-- Visitor (outside, with bag) -->
  <circle cx="158" cy="210" r="20" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <rect x="143" y="230" width="30" height="50" rx="4" fill="#4466aa" stroke="#224488" stroke-width="1.5"/>
  <!-- bag on shoulder -->
  <rect x="110" y="240" width="30" height="38" rx="4" fill="#886644" stroke="#664422" stroke-width="1.5"/>
  <line x1="143" y1="238" x2="125" y2="240" stroke="#664422" stroke-width="2"/>
  <!-- arms -->
  <line x1="143" y1="240" x2="122" y2="260" stroke="#4466aa" stroke-width="7" stroke-linecap="round"/>
  <line x1="173" y1="240" x2="192" y2="255" stroke="#4466aa" stroke-width="7" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="150" y1="280" x2="146" y2="318" stroke="#224488" stroke-width="7" stroke-linecap="round"/>
  <line x1="163" y1="280" x2="167" y2="318" stroke="#224488" stroke-width="7" stroke-linecap="round"/>

  <!-- Arrow pointing to visitor -->
  <line x1="82" y1="210" x2="130" y2="210" stroke="#cc2222" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="280" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">友だちの家に着きました。何と言いますか。</text>
</svg>
