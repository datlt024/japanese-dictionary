<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2222"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#faf6f0"/>

  <!-- Restaurant interior -->
  <!-- Floor -->
  <rect x="0" y="300" width="560" height="80" fill="#e8d8b8"/>
  <!-- Wall -->
  <rect x="0" y="0" width="560" height="50" fill="#8b6545"/>
  <text x="280" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffe8b8" font-weight="bold">レストラン</text>

  <!-- Table (round) -->
  <ellipse cx="270" cy="260" rx="120" ry="50" fill="#c8a86e" stroke="#886633" stroke-width="2.5"/>
  <!-- Tablecloth -->
  <ellipse cx="270" cy="252" rx="112" ry="44" fill="#fff8ee" stroke="#ddccaa" stroke-width="1.5"/>
  <!-- Place setting on table -->
  <ellipse cx="220" cy="252" rx="30" ry="16" fill="white" stroke="#ddd" stroke-width="1.5"/>
  <line x1="188" y1="242" x2="188" y2="262" stroke="#888" stroke-width="1.5"/>
  <line x1="195" y1="242" x2="195" y2="262" stroke="#888" stroke-width="1.5"/>
  <line x1="252" y1="242" x2="252" y2="262" stroke="#888" stroke-width="1.5"/>
  <!-- Glass -->
  <rect x="255" y="240" width="14" height="22" rx="2" fill="#aaddee" stroke="#668" stroke-width="1"/>

  <!-- Customer (left, holding menu) -->
  <circle cx="160" cy="185" r="20" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <rect x="145" y="205" width="30" height="55" rx="4" fill="#5588cc" stroke="#336699" stroke-width="1.5"/>
  <!-- Menu in hands -->
  <rect x="110" y="218" width="36" height="48" rx="3" fill="#fff" stroke="#cc4444" stroke-width="2"/>
  <line x1="115" y1="230" x2="142" y2="230" stroke="#cc4444" stroke-width="1.5"/>
  <line x1="115" y1="240" x2="142" y2="240" stroke="#cc4444" stroke-width="1.5"/>
  <line x1="115" y1="250" x2="142" y2="250" stroke="#cc4444" stroke-width="1.5"/>
  <!-- arms holding menu -->
  <line x1="145" y1="215" x2="120" y2="230" stroke="#5588cc" stroke-width="7" stroke-linecap="round"/>
  <line x1="175" y1="215" x2="192" y2="235" stroke="#5588cc" stroke-width="7" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="152" y1="260" x2="148" y2="300" stroke="#336699" stroke-width="7" stroke-linecap="round"/>
  <line x1="168" y1="260" x2="172" y2="300" stroke="#336699" stroke-width="7" stroke-linecap="round"/>

  <!-- Waiter (right) -->
  <circle cx="390" cy="175" r="20" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <!-- uniform -->
  <rect x="375" y="195" width="30" height="60" rx="4" fill="#333" stroke="#111" stroke-width="1.5"/>
  <!-- white shirt -->
  <rect x="380" y="198" width="20" height="55" rx="2" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <!-- bow tie -->
  <polygon points="388,205 395,209 388,213" fill="#cc2233"/>
  <polygon points="402,205 395,209 402,213" fill="#cc2233"/>
  <!-- tray in arm -->
  <line x1="375" y1="206" x2="340" y2="225" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="328" cy="222" rx="26" ry="8" fill="#ccb966" stroke="#886633" stroke-width="1.5"/>
  <!-- drink on tray -->
  <rect x="318" y="208" width="12" height="16" rx="2" fill="#aaddee" stroke="#668" stroke-width="1"/>
  <!-- right arm down -->
  <line x1="405" y1="206" x2="422" y2="235" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="382" y1="255" x2="378" y2="295" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <line x1="394" y1="255" x2="398" y2="295" stroke="#111" stroke-width="7" stroke-linecap="round"/>

  <!-- Arrow pointing to customer -->
  <line x1="88" y1="185" x2="132" y2="185" stroke="#cc2222" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="280" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">レストランで、お客さんが何と言いますか。</text>
</svg>
