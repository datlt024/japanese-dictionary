<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400">
  <rect width="480" height="400" fill="white"/>
  <rect width="480" height="400" fill="none" stroke="#888" stroke-width="2"/>

  <!-- Month header -->
  <rect x="20" y="20" width="440" height="40" fill="#3366cc" rx="6"/>
  <text x="240" y="46" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="white">10月</text>

  <!-- Day headers -->
  <text x="62" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#cc3333">日</text>
  <text x="122" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">月</text>
  <text x="182" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">火</text>
  <text x="242" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">水</text>
  <text x="302" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">木</text>
  <text x="362" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">金</text>
  <text x="422" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#3366cc">土</text>
  <line x1="20" y1="88" x2="460" y2="88" stroke="#ccc" stroke-width="1"/>

  <!-- Row 1: 1-7 -->
  <text x="62" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#cc3333">1</text>
  <text x="122" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">2</text>
  <text x="182" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">3</text>
  <text x="242" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">4</text>
  <text x="302" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">5</text>
  <text x="362" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">6</text>
  <text x="422" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3366cc">7</text>

  <!-- Row 2: 8-14 -->
  <!-- 8 → ① -->
  <circle cx="62" cy="158" r="18" fill="#ffeeee" stroke="#cc3333" stroke-width="2"/>
  <text x="62" y="164" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#cc3333" font-weight="bold">8</text>
  <text x="62" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#cc3333" font-weight="bold">①</text>

  <text x="122" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">9</text>

  <!-- 10 → ② -->
  <circle cx="182" cy="158" r="18" fill="#eefff0" stroke="#22aa44" stroke-width="2"/>
  <text x="182" y="164" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#22aa44" font-weight="bold">10</text>
  <text x="182" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#22aa44" font-weight="bold">②</text>

  <text x="242" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">11</text>

  <!-- 12 → ③ -->
  <circle cx="302" cy="158" r="18" fill="#eeeeff" stroke="#3355cc" stroke-width="2"/>
  <text x="302" y="164" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3355cc" font-weight="bold">12</text>
  <text x="302" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3355cc" font-weight="bold">③</text>

  <text x="362" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">13</text>
  <text x="422" y="162" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3366cc">14</text>

  <!-- Row 3: 15-21 -->
  <!-- 15 → ④ -->
  <circle cx="62" cy="230" r="18" fill="#fff8ee" stroke="#dd8800" stroke-width="2"/>
  <text x="62" y="236" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#dd8800" font-weight="bold">15</text>
  <text x="62" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#dd8800" font-weight="bold">④</text>

  <text x="122" y="234" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">16</text>
  <text x="182" y="234" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">17</text>
  <text x="242" y="234" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">18</text>
  <text x="302" y="234" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">19</text>
  <text x="362" y="234" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">20</text>
  <text x="422" y="234" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3366cc">21</text>

  <!-- Row 4: 22-28 -->
  <text x="62" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#cc3333">22</text>
  <text x="122" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">23</text>
  <text x="182" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">24</text>
  <text x="242" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">25</text>
  <text x="302" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">26</text>
  <text x="362" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">27</text>
  <text x="422" y="298" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#3366cc">28</text>

  <!-- Row 5: 29-31 -->
  <text x="62" y="358" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#cc3333">29</text>
  <text x="122" y="358" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">30</text>
  <text x="182" y="358" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">31</text>
</svg>
