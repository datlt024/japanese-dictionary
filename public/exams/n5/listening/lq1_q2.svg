<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <rect width="560" height="560" fill="white"/>
  <line x1="280" y1="0" x2="280" y2="560" stroke="#bbb" stroke-width="1.5"/>
  <line x1="0" y1="280" x2="560" y2="280" stroke="#bbb" stroke-width="1.5"/>
  <rect width="560" height="560" fill="none" stroke="#888" stroke-width="2"/>

  <text x="14" y="36" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">①</text>
  <text x="294" y="36" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">②</text>
  <text x="14" y="316" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">③</text>
  <text x="294" y="316" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">④</text>

  <!-- Room template helper: outer room = 160×140, door notch at right side -->

  <!-- ① 窓の近く (near window, desk at top) -->
  <rect x="50" y="50" width="160" height="140" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <!-- window at top -->
  <rect x="80" y="50" width="100" height="12" fill="#cce8ff" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="50" x2="130" y2="62" stroke="#555" stroke-width="1.5"/>
  <!-- door at bottom-right -->
  <rect x="178" y="162" width="32" height="28" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- desk (near window = top area) -->
  <rect x="90" y="70" width="80" height="40" fill="#d4c9b8" stroke="#555" stroke-width="2"/>
  <text x="130" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">まどの近く</text>

  <!-- ② ドアの近く (near door, desk at right bottom) -->
  <rect x="330" y="50" width="160" height="140" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <!-- window at top -->
  <rect x="360" y="50" width="100" height="12" fill="#cce8ff" stroke="#555" stroke-width="1.5"/>
  <line x1="410" y1="50" x2="410" y2="62" stroke="#555" stroke-width="1.5"/>
  <!-- door at bottom-right -->
  <rect x="458" y="162" width="32" height="28" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- desk (near door = bottom right) -->
  <rect x="430" y="140" width="52" height="36" fill="#d4c9b8" stroke="#555" stroke-width="2"/>
  <text x="410" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">ドアの近く</text>

  <!-- ③ 真ん中 (center) -->
  <rect x="50" y="330" width="160" height="140" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <!-- window at top -->
  <rect x="80" y="330" width="100" height="12" fill="#cce8ff" stroke="#555" stroke-width="1.5"/>
  <line x1="130" y1="330" x2="130" y2="342" stroke="#555" stroke-width="1.5"/>
  <!-- door at bottom-right -->
  <rect x="178" y="442" width="32" height="28" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- desk (center) -->
  <rect x="90" y="375" width="80" height="40" fill="#d4c9b8" stroke="#555" stroke-width="2"/>
  <text x="130" y="515" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">真ん中</text>

  <!-- ④ ベッドの横 (next to bed, desk beside bed) -->
  <rect x="330" y="330" width="160" height="140" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <!-- window at top -->
  <rect x="360" y="330" width="100" height="12" fill="#cce8ff" stroke="#555" stroke-width="1.5"/>
  <line x1="410" y1="330" x2="410" y2="342" stroke="#555" stroke-width="1.5"/>
  <!-- door at bottom-right -->
  <rect x="458" y="442" width="32" height="28" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- bed (long rectangle left side) -->
  <rect x="342" y="352" width="60" height="100" fill="#eebbcc" stroke="#888" stroke-width="1.5" rx="4"/>
  <!-- pillow -->
  <rect x="347" y="357" width="50" height="22" fill="#fff" stroke="#aaa" stroke-width="1"/>
  <!-- desk (next to bed = right of bed) -->
  <rect x="412" y="375" width="60" height="38" fill="#d4c9b8" stroke="#555" stroke-width="2"/>
  <text x="410" y="515" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">ベッドの横</text>
</svg>
