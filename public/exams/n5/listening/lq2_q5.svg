  <circle cx="425" cy="415" r="28" fill="#ee4444" stroke="#aa2222" stroke-width="2"/>
  <line x1="425" y1="387" x2="425" y2="378" stroke="#664422" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M425 384 Q434 378 443 381" fill="#66aa44" stroke="#448822" stroke-width="1.5"/>
