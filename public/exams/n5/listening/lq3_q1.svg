<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2222"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#f8f8f5"/>

  <!-- コンビニ interior background -->
  <rect x="0" y="0" width="560" height="380" fill="#fafaf8"/>
  <!-- Floor -->
  <rect x="0" y="290" width="560" height="90" fill="#e8e4dc"/>
  <!-- Counter -->
  <rect x="160" y="220" width="200" height="70" fill="#ddcfaa" stroke="#aa8855" stroke-width="2"/>
  <rect x="160" y="214" width="200" height="12" rx="2" fill="#ccbf99" stroke="#aa8855" stroke-width="1.5"/>
  <!-- Cash register -->
  <rect x="240" y="180" width="80" height="36" rx="4" fill="#555" stroke="#333" stroke-width="1.5"/>
  <rect x="248" y="186" width="64" height="18" rx="2" fill="#88ccee"/>
  <!-- Store sign / shelves in background -->
  <rect x="0" y="20" width="560" height="25" fill="#cc2233"/>
  <text x="280" y="38" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white" font-weight="bold">コンビニ</text>
  <!-- Shelves -->
  <rect x="10" y="60" width="100" height="150" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <line x1="10" y1="100" x2="110" y2="100" stroke="#bbb" stroke-width="1"/>
  <line x1="10" y1="140" x2="110" y2="140" stroke="#bbb" stroke-width="1"/>
  <rect x="450" y="60" width="100" height="150" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <line x1="450" y1="100" x2="550" y2="100" stroke="#bbb" stroke-width="1"/>
  <line x1="450" y1="140" x2="550" y2="140" stroke="#bbb" stroke-width="1"/>

  <!-- Store clerk (left of counter) -->
  <!-- head -->
  <circle cx="218" cy="188" r="20" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <!-- body (apron/uniform) -->
  <rect x="202" y="208" width="32" height="50" rx="4" fill="#3366aa" stroke="#224488" stroke-width="1.5"/>
  <!-- apron -->
  <rect x="207" y="212" width="22" height="44" rx="2" fill="#ffffff" stroke="#aaaacc" stroke-width="1"/>
  <!-- arms -->
  <line x1="202" y1="218" x2="182" y2="245" stroke="#3366aa" stroke-width="7" stroke-linecap="round"/>
  <line x1="234" y1="218" x2="254" y2="235" stroke="#3366aa" stroke-width="7" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="210" y1="258" x2="206" y2="295" stroke="#224488" stroke-width="7" stroke-linecap="round"/>
  <line x1="224" y1="258" x2="228" y2="295" stroke="#224488" stroke-width="7" stroke-linecap="round"/>
  <!-- cap -->
  <ellipse cx="218" cy="172" rx="22" ry="8" fill="#3366aa"/>
  <rect x="196" y="169" width="44" height="8" fill="#3366aa" rx="1"/>

  <!-- Customer (right of counter) with shopping bag -->
  <circle cx="390" cy="192" r="20" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <!-- body -->
  <rect x="374" y="212" width="32" height="50" rx="4" fill="#886644" stroke="#664422" stroke-width="1.5"/>
  <!-- arms -->
  <line x1="374" y1="220" x2="352" y2="240" stroke="#886644" stroke-width="7" stroke-linecap="round"/>
  <line x1="406" y1="220" x2="426" y2="250" stroke="#886644" stroke-width="7" stroke-linecap="round"/>
  <!-- Shopping bag in right hand -->
  <rect x="422" y="240" width="28" height="34" rx="4" fill="#ffee88" stroke="#aa8800" stroke-width="1.5"/>
  <path d="M427 240 Q430 228 436 228 Q442 228 445 240" fill="none" stroke="#aa8800" stroke-width="1.5"/>
  <!-- legs -->
  <line x1="382" y1="262" x2="378" y2="300" stroke="#664422" stroke-width="7" stroke-linecap="round"/>
  <line x1="396" y1="262" x2="400" y2="300" stroke="#664422" stroke-width="7" stroke-linecap="round"/>

  <!-- Arrow pointing to customer -->
  <line x1="460" y1="192" x2="424" y2="192" stroke="#cc2222" stroke-width="3" marker-end="url(#arr)"/>
  <!-- Arrow label -->
  <text x="480" y="188" font-family="sans-serif" font-size="12" fill="#cc2222" font-weight="bold">→</text>

  <!-- Caption -->
  <text x="280" y="360" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">コンビニで、お客さんが何と言いますか。</text>
</svg>
