<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <rect width="560" height="560" fill="white"/>

  <!-- Title -->
  <text x="280" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555">ちずを見てください</text>

  <!-- Streets -->
  <!-- Main vertical road (center) -->
  <rect x="240" y="60" width="80" height="450" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  <!-- Horizontal road (middle) -->
  <rect x="60" y="220" width="440" height="80" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>

  <!-- Buildings / locations -->
  <!-- ① 上の左側 (top-left quadrant) -->
  <rect x="80" y="90" width="140" height="110" fill="#ddeeff" stroke="#558" stroke-width="2" rx="4"/>
  <text x="150" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334">としょかん</text>
  <text x="150" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#667">（図書館）</text>
  <circle cx="90" cy="100" r="16" fill="#3366cc"/>
  <text x="90" y="106" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">①</text>

  <!-- ② 上の右側 -->
  <rect x="340" y="90" width="140" height="110" fill="#ffeedd" stroke="#885" stroke-width="2" rx="4"/>
  <text x="410" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334">ゆうびんきょく</text>
  <text x="410" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#667">（郵便局）</text>
  <circle cx="350" cy="100" r="16" fill="#3366cc"/>
  <text x="350" y="106" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">②</text>

  <!-- ③ 下の左側 -->
  <rect x="80" y="320" width="140" height="110" fill="#ddffd8" stroke="#585" stroke-width="2" rx="4"/>
  <text x="150" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334">コンビニ</text>
  <circle cx="90" cy="330" r="16" fill="#3366cc"/>
  <text x="90" y="336" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">③</text>

  <!-- ④ 下の右側 -->
  <rect x="340" y="320" width="140" height="110" fill="#ffeeff" stroke="#885" stroke-width="2" rx="4"/>
  <text x="410" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334">スーパー</text>
  <circle cx="350" cy="330" r="16" fill="#3366cc"/>
  <text x="350" y="336" text-anchor="middle" font-family="sans-serif" font-size="16" fill="white" font-weight="bold">④</text>

  <!-- Station at bottom -->
  <rect x="200" y="465" width="160" height="70" fill="#ffeecc" stroke="#886" stroke-width="2" rx="4"/>
  <text x="280" y="490" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334">えき</text>
  <text x="280" y="512" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#667">（駅）</text>

  <!-- compass / north arrow -->
  <text x="512" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">北↑</text>
</svg>
