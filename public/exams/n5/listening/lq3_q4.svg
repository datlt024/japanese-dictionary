<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cc2222"/>
    </marker>
  </defs>
  <!-- Sky background -->
  <rect width="560" height="380" fill="#d8eefa"/>
  <!-- Ground -->
  <rect x="0" y="295" width="560" height="85" fill="#c2d8a0"/>
  <!-- Path -->
  <rect x="0" y="295" width="560" height="20" fill="#e0d8c0"/>

  <!-- Famous landmark (pagoda/temple) in background -->
  <!-- Base -->
  <rect x="360" y="160" width="130" height="135" fill="#cc9966" stroke="#aa7744" stroke-width="2"/>
  <!-- Level 1 -->
  <polygon points="345,160 505,160 520,140 330,140" fill="#aa7744" stroke="#884422" stroke-width="1.5"/>
  <!-- Level 2 -->
  <rect x="380" y="100" width="90" height="42" fill="#cc9966" stroke="#aa7744" stroke-width="1.5"/>
  <polygon points="368,100 502,100 514,82 356,82" fill="#aa7744" stroke="#884422" stroke-width="1.5"/>
  <!-- Level 3 -->
  <rect x="400" y="50" width="50" height="34" fill="#cc9966" stroke="#aa7744" stroke-width="1.5"/>
  <polygon points="390,50 460,50 468,34 382,34" fill="#aa7744" stroke="#884422" stroke-width="1.5"/>
  <!-- Spire -->
  <line x1="425" y1="34" x2="425" y2="14" stroke="#884422" stroke-width="2"/>
  <!-- Windows on base -->
  <rect x="378" y="185" width="30" height="40" rx="4" fill="#886644" stroke="#664422" stroke-width="1"/>
  <rect x="432" y="185" width="30" height="40" rx="4" fill="#886644" stroke="#664422" stroke-width="1"/>
  <!-- Door -->
  <rect x="405" y="228" width="30" height="67" fill="#664422" stroke="#442200" stroke-width="1.5"/>

  <!-- Tourist / person being asked (right side, with camera) -->
  <circle cx="290" cy="200" r="20" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <rect x="275" y="220" width="30" height="55" rx="4" fill="#6699aa" stroke="#446677" stroke-width="1.5"/>
  <!-- Camera in hands -->
  <rect x="248" y="224" width="30" height="22" rx="4" fill="#333" stroke="#111" stroke-width="1.5"/>
  <circle cx="260" cy="235" r="7" fill="#aaddee" stroke="#668" stroke-width="1.5"/>
  <circle cx="260" cy="235" r="3" fill="#334455"/>
  <!-- viewfinder bump -->
  <rect x="268" y="221" width="10" height="7" rx="2" fill="#444"/>
  <!-- arms -->
  <line x1="275" y1="230" x2="252" y2="238" stroke="#6699aa" stroke-width="7" stroke-linecap="round"/>
  <line x1="305" y1="230" x2="322" y2="248" stroke="#6699aa" stroke-width="7" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="282" y1="275" x2="278" y2="315" stroke="#446677" stroke-width="7" stroke-linecap="round"/>
  <line x1="294" y1="275" x2="298" y2="315" stroke="#446677" stroke-width="7" stroke-linecap="round"/>
  <!-- Camera strap -->
  <path d="M248 224 Q270 210 305 220" fill="none" stroke="#886644" stroke-width="1.5"/>

  <!-- Person asking for photo (left side) -->
  <circle cx="130" cy="210" r="20" fill="#ffddbb" stroke="#666" stroke-width="1.5"/>
  <rect x="115" y="230" width="30" height="55" rx="4" fill="#cc6644" stroke="#aa4422" stroke-width="1.5"/>
  <!-- Pointing gesture arm -->
  <line x1="145" y1="238" x2="185" y2="248" stroke="#cc6644" stroke-width="7" stroke-linecap="round"/>
  <line x1="115" y1="238" x2="96" y2="258" stroke="#cc6644" stroke-width="7" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="122" y1="285" x2="118" y2="320" stroke="#aa4422" stroke-width="7" stroke-linecap="round"/>
  <line x1="134" y1="285" x2="138" y2="320" stroke="#aa4422" stroke-width="7" stroke-linecap="round"/>
  <!-- Backpack -->
  <rect x="100" y="232" width="16" height="28" rx="4" fill="#886644" stroke="#664422" stroke-width="1.5"/>

  <!-- Arrow pointing to person being asked (photographer) -->
  <line x1="218" y1="210" x2="264" y2="210" stroke="#cc2222" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Caption -->
  <text x="280" y="364" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">観光地で、写真を頼まれています。何と言いますか。</text>
</svg>
