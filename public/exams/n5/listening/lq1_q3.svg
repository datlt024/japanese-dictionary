  <!-- ① はれ (sunny) -->
  <text x="14" y="36" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">①</text>
  <circle cx="140" cy="148" r="44" fill="none" stroke="#444" stroke-width="3"/>
  <line x1="140" y1="84" x2="140" y2="70" stroke="#444" stroke-width="2.5"/>
  <line x1="140" y1="212" x2="140" y2="226" stroke="#444" stroke-width="2.5"/>
  <line x1="76" y1="148" x2="62" y2="148" stroke="#444" stroke-width="2.5"/>
  <line x1="204" y1="148" x2="218" y2="148" stroke="#444" stroke-width="2.5"/>
  <line x1="95" y1="103" x2="85" y2="93" stroke="#444" stroke-width="2.5"/>
  <line x1="185" y1="193" x2="195" y2="203" stroke="#444" stroke-width="2.5"/>
