  <line x1="96" y1="425" x2="86" y2="455" stroke="#4488cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="118" y1="425" x2="108" y2="455" stroke="#4488cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="425" x2="130" y2="455" stroke="#4488cc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="162" y1="425" x2="152" y2="455" stroke="#4488cc" stroke-width="2.5" stroke-linecap="round"/>
