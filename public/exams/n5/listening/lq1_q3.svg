  <text x="420" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">くもり</text>

  <!-- ③ あめ (rainy) -->
  <text x="14" y="316" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">③</text>
  <ellipse cx="118" cy="388" rx="46" ry="30" fill="#e8e8e8" stroke="#555" stroke-width="2.5"/>
