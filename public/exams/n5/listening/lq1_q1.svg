<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <rect width="560" height="560" fill="white"/>
  <line x1="280" y1="0" x2="280" y2="560" stroke="#bbb" stroke-width="1.5"/>
  <line x1="0" y1="280" x2="560" y2="280" stroke="#bbb" stroke-width="1.5"/>
  <rect width="560" height="560" fill="none" stroke="#888" stroke-width="2"/>

  <!-- Numbers -->
  <text x="14" y="36" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">①</text>
  <text x="294" y="36" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">②</text>
  <text x="14" y="316" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">③</text>
  <text x="294" y="316" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">④</text>

  <!-- ① すし (sushi) -->
  <!-- rice base oval -->
  <ellipse cx="140" cy="168" rx="60" ry="26" fill="#f8f6f0" stroke="#555" stroke-width="2.5"/>
  <!-- fish topping -->
  <rect x="86" y="132" width="108" height="38" rx="8" fill="#ffccaa" stroke="#555" stroke-width="2.5"/>
  <!-- fish texture line -->
  <line x1="86" y1="151" x2="194" y2="151" stroke="#cc8866" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="140" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">すし</text>

  <!-- ② ラーメン (ramen) -->
  <!-- bowl -->
  <path d="M328 120 L352 192 Q420 222 488 192 L512 120 Z" fill="#f8f6f0" stroke="#555" stroke-width="2.5"/>
  <ellipse cx="420" cy="120" rx="92" ry="18" fill="#f8f6f0" stroke="#555" stroke-width="2.5"/>
  <!-- noodles -->
  <path d="M358 128 Q380 118 400 128 Q420 138 440 128 Q460 118 478 128" fill="none" stroke="#cc9966" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M355 142 Q377 132 397 142 Q417 152 437 142 Q457 132 477 142" fill="none" stroke="#cc9966" stroke-width="2.5" stroke-linecap="round"/>
  <!-- egg half -->
  <ellipse cx="400" cy="110" rx="18" ry="12" fill="#ffffee" stroke="#aaa" stroke-width="1.5"/>
  <circle cx="400" cy="110" r="6" fill="#ffcc44" stroke="none"/>
  <!-- chopsticks -->
  <line x1="395" y1="72" x2="418" y2="118" stroke="#a0522d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="408" y1="68" x2="428" y2="116" stroke="#a0522d" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">ラーメン</text>

  <!-- ③ カレー (curry rice) -->
  <!-- plate oval -->
  <ellipse cx="140" cy="415" rx="90" ry="52" fill="#f8f6f0" stroke="#555" stroke-width="2.5"/>
  <!-- rice mound (right half) -->
  <path d="M140 363 Q170 352 200 363 Q200 415 200 415 L140 415 Z" fill="#fffde8" stroke="#999" stroke-width="1.5"/>
  <!-- curry divider curve -->
  <path d="M140 415 Q150 380 200 363" fill="none" stroke="#999" stroke-width="1.5"/>
  <!-- curry sauce dots -->
  <circle cx="100" cy="400" r="4" fill="#cc8833"/>
  <circle cx="88" cy="416" r="4" fill="#cc8833"/>
  <circle cx="106" cy="428" r="4" fill="#cc8833"/>
  <circle cx="120" cy="408" r="3" fill="#cc8833"/>
  <text x="140" y="498" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">カレー</text>

  <!-- ④ サンドイッチ (sandwich) -->
  <!-- top bread -->
  <rect x="300" y="370" width="240" height="28" rx="8" fill="#f0d89a" stroke="#777" stroke-width="2.5"/>
  <!-- filling layer 1 (lettuce green) -->
  <rect x="304" y="396" width="232" height="16" rx="2" fill="#c8e8a0" stroke="#88bb66" stroke-width="1.5"/>
  <!-- filling layer 2 (ham pink) -->
  <rect x="304" y="410" width="232" height="14" rx="2" fill="#ffbbcc" stroke="#cc8899" stroke-width="1.5"/>
  <!-- bottom bread -->
  <rect x="300" y="422" width="240" height="28" rx="8" fill="#f0d89a" stroke="#777" stroke-width="2.5"/>
  <!-- diagonal cut line -->
  <line x1="420" y1="370" x2="420" y2="450" stroke="#aaa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="420" y="508" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#333">サンドイッチ</text>
</svg>
