<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580">
  <rect width="720" height="580" fill="white"/>

  <!-- ━━━ ア: 千円 bill (top left) ━━━ -->
  <text x="108" y="58" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="44" fill="#333" font-weight="bold">ア</text>

  <!-- Bill outer -->
  <rect x="38" y="70" width="218" height="118" rx="8" fill="#f2f2e0" stroke="#999" stroke-width="2.5"/>
  <!-- Bill inner border -->
  <rect x="48" y="78" width="198" height="102" rx="4" fill="none" stroke="#bbb" stroke-width="1.2"/>
  <!-- Left decoration strip -->
  <rect x="54" y="84" width="10" height="90" rx="2" fill="#e0e0b8" stroke="#bbb" stroke-width="1"/>
  <!-- Right decoration strip -->
  <rect x="232" y="84" width="10" height="90" rx="2" fill="#e0e0b8" stroke="#bbb" stroke-width="1"/>
  <!-- Denomination text -->
  <text x="60" y="116" font-family="serif" font-size="18" fill="#555" font-weight="bold">千円</text>
  <!-- Portrait oval -->
  <ellipse cx="187" cy="126" rx="38" ry="46" fill="#e6e6cc" stroke="#bbb" stroke-width="1.5"/>
  <!-- Simple portrait face -->
  <ellipse cx="187" cy="110" rx="16" ry="18" fill="#d8d8b8" stroke="#bbb" stroke-width="1"/>
  <!-- Portrait shoulders -->
  <path d="M163 128 Q187 120 211 128 L214 152 Q187 146 160 152 Z" fill="#d8d8b8" stroke="#bbb" stroke-width="1"/>
  <!-- Serial number (decorative) -->
  <text x="60" y="152" font-family="monospace" font-size="10" fill="#aaa">AB123456C</text>
  <text x="158" y="152" font-family="monospace" font-size="10" fill="#aaa">AB123456C</text>

  <!-- ━━━ イ: Jacket / hoodie (top right) ━━━ -->
  <text x="540" y="58" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="44" fill="#333" font-weight="bold">イ</text>

  <!-- Jacket body -->
  <rect x="432" y="88" width="240" height="224" rx="14" fill="#c8c8c8" stroke="#999" stroke-width="2"/>
  <!-- Hood -->
  <path d="M432 102 Q462 68 552 62 Q642 68 672 102 L660 138 Q552 112 444 138 Z" fill="#c4c4c4" stroke="#999" stroke-width="2"/>
  <!-- Hood inner -->
  <path d="M448 115 Q552 96 658 115" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <!-- Zipper center line -->
  <line x1="552" y1="96" x2="552" y2="312" stroke="#999" stroke-width="3"/>
  <!-- Zipper pull -->
  <rect x="546" y="188" width="14" height="20" rx="4" fill="#bbb" stroke="#999" stroke-width="1.5"/>
  <line x1="553" y1="208" x2="553" y2="216" stroke="#999" stroke-width="2"/>
  <!-- Left pocket -->
  <rect x="444" y="262" width="52" height="36" rx="6" fill="none" stroke="#999" stroke-width="1.8"/>
  <!-- Right pocket -->
  <rect x="608" y="262" width="52" height="36" rx="6" fill="none" stroke="#999" stroke-width="1.8"/>
  <!-- Left sleeve -->
  <path d="M432 106 L366 212 L392 226 L452 130 Z" fill="#c0c0c0" stroke="#999" stroke-width="2"/>
  <!-- Left cuff -->
  <ellipse cx="379" cy="222" rx="28" ry="14" fill="#b8b8b8" stroke="#999" stroke-width="1.5"/>
  <!-- Right sleeve -->
  <path d="M672 106 L738 212 L712 226 L652 130 Z" fill="#c0c0c0" stroke="#999" stroke-width="2"/>
  <!-- Right cuff -->
  <ellipse cx="725" cy="222" rx="28" ry="14" fill="#b8b8b8" stroke="#999" stroke-width="1.5"/>
  <!-- Bottom ribbing -->
  <rect x="432" y="298" width="240" height="20" rx="0 0 14 14" fill="#c0c0c0" stroke="#999" stroke-width="1.2"/>

  <!-- ━━━ ウ: Mountain map / picture (bottom center) ━━━ -->
  <text x="338" y="388" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif" font-size="44" fill="#333" font-weight="bold">ウ</text>

  <!-- Frame outer -->
  <rect x="140" y="400" width="440" height="168" rx="7" fill="#f0f0e8" stroke="#999" stroke-width="2.5"/>
  <!-- Frame inner border -->
  <rect x="150" y="410" width="420" height="148" rx="4" fill="white" stroke="#bbb" stroke-width="1.2"/>

  <!-- Mountain scene: sky -->
  <rect x="152" y="412" width="416" height="144" fill="#e6eef8"/>

  <!-- Mountain main shape -->
  <polygon points="360,420 192,552 528,552" fill="#d2d0c0" stroke="#aaa" stroke-width="1.5"/>
  <!-- Snow cap -->
  <polygon points="360,420 338,462 382,462" fill="white" stroke="#ccc" stroke-width="1"/>

  <!-- Trail path markers (♦ shapes = hikers/markers on map) -->
  <polygon points="326,484 320,492 326,500 332,492" fill="#555"/>
  <polygon points="344,472 338,480 344,488 350,480" fill="#555"/>
  <polygon points="362,486 356,494 362,502 368,494" fill="#555"/>
  <polygon points="382,476 376,484 382,492 388,484" fill="#555"/>
  <polygon points="400,494 394,502 400,510 406,502" fill="#555"/>
  <!-- Trail dashed line connecting markers -->
  <path d="M326 492 Q344 480 362 494 Q382 484 400 502" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Trees at base (left) -->
  <polygon points="228,552 218,526 238,526" fill="#556644"/>
  <polygon points="256,552 244,526 268,526" fill="#556644"/>
  <polygon points="282,552 270,528 294,528" fill="#556644"/>
  <!-- Trees at base (right) -->
  <polygon points="448,552 438,528 458,528" fill="#556644"/>
  <polygon points="474,552 462,526 486,526" fill="#556644"/>
  <polygon points="500,552 488,526 512,526" fill="#556644"/>
</svg>
